<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicktrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1>CLICKTRACK</h1>
      <div id="currency-display">
        <span id="currency">0</span> beats
      </div>
    </header>

    <!-- Now Playing -->
    <div id="now-playing" class="panel">
      <div id="track-info">
        <div id="album-art-container">
          <div id="album-art-placeholder">♪</div>
          <img id="album-art" style="display:none" alt="Album art">
        </div>
        <div id="track-details">
          <div id="track-name">No song playing</div>
          <div id="track-artist"></div>
          <div id="bpm-display">
            <span id="bpm-value">--</span> BPM
            <span id="mode-label">(offline song)</span>
          </div>
        </div>
      </div>
      <button id="spotify-connect" class="btn">Connect Spotify</button>
    </div>

    <!-- Beat Grid -->
    <div id="beat-grid">
      <div class="key-row">
        <div class="key locked" data-key="q">Q</div>
        <div class="key locked" data-key="w">W</div>
        <div class="key locked" data-key="e">E</div>
      </div>
      <div class="key-row">
        <div class="key locked" data-key="a">A</div>
        <div class="key active" data-key="s">S</div>
        <div class="key locked" data-key="d">D</div>
      </div>
      <div class="key-row">
        <div class="key locked" data-key="z">Z</div>
        <div class="key locked" data-key="x">X</div>
        <div class="key locked" data-key="c">C</div>
      </div>
    </div>

    <!-- Beat Pulse Indicator -->
    <div id="beat-pulse">
      <div id="beat-ring"></div>
      <div id="beat-dot"></div>
    </div>

    <!-- Combo & Feedback -->
    <div id="feedback">
      <div id="combo-display">
        <span id="combo-count">0</span>x combo
        <span id="combo-mult">×1</span>
      </div>
      <div id="tap-feedback"></div>
    </div>

    <!-- Upgrades Panel -->
    <div id="upgrades" class="panel">
      <h2>Upgrades</h2>
      <div id="key-upgrades"></div>
      <div id="tier-unlock">
        <button id="unlock-tier-btn" class="btn">
          Unlock next tier — <span id="tier-cost"></span> beats
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div id="stats" class="panel">
      <h2>Stats</h2>
      <div id="stats-content"></div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="spotify.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
