<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicktrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>CLICKTRACK</h1>
      <div id="currency-display">
        <span id="currency">0</span> beats
      </div>
    </header>

    <!-- Audio Status -->
    <div id="audio-status" class="panel">
      <div id="status-row">
        <button id="listen-btn" class="btn">&#127925; Listen</button>
        <button id="stop-btn" class="btn btn-secondary" style="display:none;">&#9632; Stop</button>
        <div id="vu-meter">
          <div id="vu-fill"></div>
        </div>
        <span id="beat-counter" class="hint">Play some music and click Listen</span>
      </div>
    </div>

    <!-- Note Track (Guitar Hero style) -->
    <div id="note-track">
      <div id="lanes-container">
        <!-- lanes + notes generated dynamically -->
      </div>
      <div id="hit-zone">
        <div id="hit-zone-line"></div>
        <div id="lane-labels">
          <!-- key labels generated dynamically -->
        </div>
      </div>
    </div>

    <!-- Feedback -->
    <div id="feedback">
      <div id="combo-display">
        <span id="combo-count">0</span>x combo
        <span id="combo-mult">&times;1</span>
      </div>
      <div id="tap-feedback"></div>
      <div id="accuracy-display">
        <span class="acc-perfect"><span id="perfect-count">0</span> perfect</span>
        <span class="acc-good"><span id="good-count">0</span> good</span>
        <span class="acc-ok"><span id="ok-count">0</span> ok</span>
        <span class="acc-miss"><span id="miss-count">0</span> miss</span>
      </div>
    </div>

    <!-- Upgrades -->
    <div id="upgrades" class="panel">
      <h2>Upgrades</h2>
      <div id="key-upgrades"></div>
      <div id="tier-unlock">
        <button id="unlock-tier-btn" class="btn">
          Unlock next tier &mdash; <span id="tier-cost"></span> beats
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div id="stats" class="panel">
      <h2>Stats</h2>
      <div id="stats-content"></div>
    </div>
  </div>

    <!-- Source Picker Modal -->
    <div id="source-picker-overlay" style="display:none;">
      <div id="source-picker">
        <h2>Select Audio Source</h2>
        <p class="hint">Choose a screen or window to listen to</p>
        <div id="source-list"></div>
        <button id="source-cancel-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
